name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test on node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest node engines.node claims, plus current LTS. An untested
        # floor is a guess — every Dockerfile here is node 24.
        node: ["22", "lts/*"]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
          cache: "pnpm"
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Lint 🔍
        run: pnpm run lint
      - name: Format 🔍
        run: pnpm run format:check
      - name: TypeScript 🔍
        run: pnpm run typecheck
      - name: Test 🧪
        run: pnpm run test
      - name: Build 📦
        run: pnpm run build
      # The tool list is the server's public contract, and it is easy to change
      # by accident. This asserts the built CLI still speaks MCP over stdio, and
      # that an unconfigured capability is absent rather than merely refused.
      # The tool list is this server's public contract and is easy to change by
      # accident. Run with NO credentials: the server must still speak MCP over
      # stdio and answer tools/list. A server that exits here shows in the client
      # as a bare "Connection closed" with stderr swallowed, so nothing explains
      # what to configure.
      #
      # UNIFI_APP_VERSION is load-bearing, not decoration: without it the startup
      # probe tries to reach a console that does not exist in CI and burns its
      # timeout on every run. Setting it also exercises the override path.
      - name: MCP smoke test 🧪
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
          | env HOME=/nonexistent UNIFI_CONFIG=/nonexistent.json UNIFI_APP_VERSION=10.6.0 \
              node dist/cli.js 2>/dev/null > /tmp/tools.json
          grep -q 'unifi_auth_status' /tmp/tools.json \
            || { echo "server did not answer tools/list without credentials"; exit 1; }
          # Negative half A — the CREDENTIAL gate, checked on a READ tool. A
          # smoke test that only checks writes would miss this entirely.
          ! grep -q '"name":"unifi_list_clients"' /tmp/tools.json \
            || { echo "credential-gated tools leaked"; exit 1; }
          # Negative half B — the WRITE gate. An unconfigured capability must not
          # merely refuse, it must not be registered at all.
          ! grep -qE '"name":"unifi_(restart_device|delete_vouchers|create_vouchers)"' /tmp/tools.json \
            || { echo "write tools leaked without UNIFI_ALLOW_WRITES"; exit 1; }
          # The legacy transport is opt-in and must stay invisible until it is.
          ! grep -q '"name":"unifi_legacy_' /tmp/tools.json \
            || { echo "legacy tools leaked without UNIFI_ENABLE_LEGACY"; exit 1; }

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    # id-token: write is required for OIDC trusted publishing + provenance
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Setup pnpm 🔧
        uses: pnpm/action-setup@v6
      - name: Setup node 🔧
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: "pnpm"
          registry-url: https://registry.npmjs.org
      - name: Install 🪄
        run: pnpm install --frozen-lockfile
      - name: Upgrade npm 🔧
        # OIDC trusted publishing needs a recent npm CLI
        run: npm install -g npm@latest
      # A version already on npm cannot be republished, so re-running this job — after
      # re-pushing a tag, or a manual re-run — would fail on a duplicate. Skip instead,
      # so the tag is the source of truth and pushing one is always safe.
      - name: Check npm for this version 🔍
        id: published
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already published — skipping publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish 🚀
        if: steps.published.outputs.exists == 'false'
        run: npm publish --provenance --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5
      - name: Create release 🏷️
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
